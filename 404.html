<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0a08" />
  <meta name="robots" content="noindex, follow" />
  <title>Page not found — Willow Road Barber Shop, Guelph</title>
  <link rel="icon" type="image/png" href="images/willow-road-barbershop-favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0c0a08;
      color: #ede3d2;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap { max-width: 540px; text-align: center; }
    .eyebrow {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #a87e28;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(56px, 9vw, 96px);
      font-weight: 500;
      line-height: 0.92;
      letter-spacing: -0.026em;
      margin-bottom: 18px;
    }
    h1 em { font-style: italic; font-weight: 300; color: #b12828; }
    p {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(237,227,210,0.74);
      margin-bottom: 36px;
    }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block;
      padding: 16px 32px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
    }
    .btn-primary { background: #b12828; color: #fff; }
    .btn-primary:hover { background: #c83838; }
    .btn-ghost { color: #ede3d2; border: 1px solid rgba(237,227,210,0.18); }
    .btn-ghost:hover { border-color: #ede3d2; }
    a:focus-visible { outline: 2px solid #c8a050; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">404 — Page not found</p>
    <h1>Looks like that <em>cut</em> is missing.</h1>
    <p>The page you're looking for has moved or doesn't exist. Head back to the home page or give us a call at 59 Willow Road, Guelph.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Home</a>
      <a class="btn btn-ghost" href="tel:+15198215231">Call (519) 821-5231</a>
    </div>
  </main>
</body>
</html>
